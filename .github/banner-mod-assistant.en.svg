<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 320" width="1280" height="320" role="img" aria-label="Mod Assistant: a mod manager for Dota 2">
  <title>Mod Assistant: a mod manager for Dota 2</title>
