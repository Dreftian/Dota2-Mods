      <stop offset="0" stop-color="#101418"/>
      <stop offset="0.55" stop-color="#151a22"/>
      <stop offset="1" stop-color="#1c1830"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.82" cy="0.45" r="0.55">
